name: Build VoxelLauncher

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Verify toolchain
        run: |
          node --version
          corepack --version
          pnpm --version
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Build native helper
        run: dotnet publish native/VoxelLauncher.Native.csproj -c Release -r win-x64 --self-contained true -o native/publish
      - name: Package Windows installer
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VoxelLauncher-Windows
          path: dist/*.exe
          if-no-files-found: error
